name: Publish HDR server image

on:
  workflow_dispatch:
  push:
    branches: [hdr-original-fallback]
    tags: ['hdr-v*']

concurrency:
  group: publish-hdr-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.27.1
      - run: pnpm install --frozen-lockfile --filter immich-web... --filter immich...
      - run: pnpm --filter @immich/sdk build
      - run: pnpm --filter @immich/plugin-sdk build
      - run: pnpm --filter immich-web exec svelte-kit sync
      - name: Player regression tests
        run: pnpm --filter immich-web test --run src/lib/components/asset-viewer/VideoNativeViewer.spec.ts src/lib/components/asset-viewer/AssetViewerNavBar.spec.ts src/lib/utils.spec.ts
      - name: Type-check the web player
        run: pnpm --filter immich-web check:svelte
      - run: pnpm --filter immich-web check:typescript
      - name: Existing transcoding command regression tests
        run: pnpm --filter immich test --run src/services/media.service.spec.ts src/repositories/media-color.spec.ts src/services/asset-media.service.spec.ts

  publish:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name and tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${OWNER,,}/immich-server"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "commit=$image:sha-$COMMIT" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == tag ]]; then
            echo "channel=$image:$REF" >> "$GITHUB_OUTPUT"
          else
            echo "channel=$image:hdr" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the fork image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.commit }}
            ${{ steps.image.outputs.channel }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ steps.image.outputs.name }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=hdr-server
          cache-to: type=gha,mode=max,scope=hdr-server
      - name: Verify FFmpeg and HDR conversion inside the finished image
        env:
          IMAGE: ${{ steps.image.outputs.commit }}
        run: docker run --rm --entrypoint node "$IMAGE" /usr/src/app/server/bin/verify-hdr.mjs
      - name: Publish only after verification passes
        env:
          COMMIT_IMAGE: ${{ steps.image.outputs.commit }}
          CHANNEL_IMAGE: ${{ steps.image.outputs.channel }}
        run: |
          docker push "$COMMIT_IMAGE"
          docker push "$CHANNEL_IMAGE"
          echo "Published \`$COMMIT_IMAGE\` and \`$CHANNEL_IMAGE\`." >> "$GITHUB_STEP_SUMMARY"
